name: Facebook → BigQuery Sync

# ═══════════════════════════════════════════════════════════════════════════
#  v3 CHANGES
#  ──────────
#   1. timeout-minutes: 60 → 180
#      08-21 ka run 80% pe atka aur 60 min pe GitHub ne CANCEL kar diya.
#      Ab script ke apne MAX_POLL_SECONDS guard ko kaam karne ka mauqa milta
#      hai — wo account ko fail mark karke aage barhta hai (data uda nahi deta).
#
#   2. MAX_POLL_SECONDS / POLL_INTERVAL / ACTIVE_ONLY / ALLOW_TRUNCATE / DRY_RUN
#      env vars — sab workflow_dispatch se control ho sakte hain.
#
#   3. keepalive job — GitHub 60 din tak koi commit na ho to scheduled
#      workflows KHUD BAND kar deta hai. Isi ne pehle AdMob (~$27K) aur FX
#      (30 din) kha liye the. Ab har mahine ek dummy commit ho jayega.
#
#   4. concurrency guard — do run ek saath na chalein (dono DELETE karenge).
#
#   5. "Notify on failure" ab asal mein FAIL karta hai (v2.1 mein sirf echo
#      tha, jo exit 0 deta tha aur workflow green dikhta tha).
#
# ═══════════════════════════════════════════════════════════════════════════
#  🆕 v4 CHANGES  (2026-09-02) — 120-DIN BACKFILL KE LIYE
#  ─────────────────────────────────────────────────────
#   6. timeout-minutes: 180 → 240
#      Run #196 THEEK 180 min par CANCEL hua tha. 120-din ke backfill mein
#      insights ka hissa bohot barhega, is liye gunjaish chahiye.
#      (GitHub-hosted runner ki hard limit 6 ghante = 360 min hai.)
#
#   7. 🔴 MAX_POLL_SECONDS ab HARDCODED NAHI — dispatch input ban gaya.
#      PEHLE: MAX_POLL_SECONDS: "900"  ← YAML edit ke bagair badla hi nahi ja sakta tha
#
#      Ye HAR async insights job par alag lagta hai. 120 din ka data
#      Facebook ke andar process hone mein 15 min se zyada le sakta hai —
#      aur timeout hone par:
#          return None → record_failure → run RED
#          us account ka PURANA data mehfooz rehta hai (guard theek hai)
#          magar NAYA data aata hi nahi
#
#      Backfill ke liye 2400 (40 min) do. Rozana run ke liye 900 hi theek hai.
#
#   8. ad_creatives ke knobs (v3.8/v3.9 mein bane, YAML mein the hi nahi):
#      Run #196 creatives par 173 min kha kar 3 ghante pe CANCEL hua tha.
#      Ab poore phase ka waqt ka budget hai. Run #199 mein 19 min laga.
#
#      CREATIVES_ACCOUNT_BUDGET=180 se 4 bare accounts poore nahi hue.
#      BQ ke aankdon se: unhe 191s / 208s / 214s / 633s chahiyen the.
#      Is liye default ab 700 (phase budget 2400 ke saath).
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 🔁 HAR 15 MINUTE — public repo par Actions FREE hai.
    #    Har run pehle BQ se poochti hai "kal ka data hai?" — hai to 10 sec
    #    mein skip. Nahi to poora loader (45 din MERGE). Der ≤ ~20 min.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of data to pull"
        required: false
        default: '45'
      max_poll_seconds:
        description: "🆕 Ek async insights job kitni der poll ho (rozana 900 · 120-din backfill 2400)"
        required: false
        default: "900"
      creatives_total_budget:
        description: "🆕 POORE ad_creatives phase ki hadd, seconds (default 2400 = 40 min)"
        required: false
        default: "2400"
      creatives_account_budget:
        description: "🆕 Ek account ke creatives ki hadd, seconds (default 700)"
        required: false
        default: "700"
      dry_run:
        description: "1 = fetch karo lekin BigQuery ko haath mat lagao"
        required: false
        default: "0"
      active_only:
        description: "1 = sirf status=active accounts (v2.1 wala behaviour — data loss ka khatra)"
        required: false
        default: "0"
      allow_truncate:
        description: "0 = dimension tables kabhi TRUNCATE na hon"
        required: false
        default: "1"

# 🆕 v3: do run ek saath chalein to dono DELETE karenge — bacho.
concurrency:
  group: facebook-bigquery-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Facebook Data to BigQuery
    runs-on: ubuntu-latest
    timeout-minutes: 240          # 🆕 v4: 180 → 240 (GitHub ki hadd 360)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ══════════════════════════════════════════════════════════════════════
      # 🔧 bq CLI — self-heal/verify ke liye. WAHI secret jo loader use karta hai.
      #    Koi naya secret nahi.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🔑 GCP auth (bq ke liye)"
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: "🔧 setup-gcloud (bq CLI)"
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ══════════════════════════════════════════════════════════════════════
      # 🩺 SELF-HEAL ① — PEHLE ki haalat yaad rakho (rollback/verify ke liye)
      # ══════════════════════════════════════════════════════════════════════
      - name: "🩺 Pehle ki haalat — rows aur aakhri din"
        id: before
        continue-on-error: true
        run: |
          set +e
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date_start) AS STRING) FROM \`terafort.facebook_data.ad_insights_daily\`" 2>/dev/null | tail -1)
          ROWS=$(echo "$R" | cut -d, -f1); LAST=$(echo "$R" | cut -d, -f2)
          echo "📊 pehle: ${ROWS:-?} rows · aakhri din ${LAST:-?}"
          echo "rows=${ROWS:-0}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST:-}"  >> "$GITHUB_OUTPUT"
          # ── gap dekh kar lookback tay karo ──
          LB="${{ github.event.inputs.lookback_days || '45' }}"
          if [[ "$LAST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$GAP" -gt "$LB" ]; then
              LB=$(( GAP + 3 )); [ "$LB" -gt 180 ] && LB=180
              echo "::warning::🩺 Self-heal: data ${GAP} din purana — lookback ${LB} kiya"
            fi
          else
            # ── 🛡️ SAFETY NET: bq nahi chala (setup-gcloud nahi?) ──
            #    Bina jaanch ke har 15 min poora loader chalana = platform API par
            #    bojh (rate limit). Is liye sirf GHANTE KE SHURU mein chalao
            #    (:00–:14) — yani purane 1-ghanta cron jaisa. Baqi 15-min skip.
            MIN=$((10#$(date -u +%M)))
            if [ "$MIN" -ge 15 ]; then
              echo "⚠️ BQ check nahi ho saka — sirf ghante ke shuru mein chalta hoon (abhi :$MIN) — skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "lookback=$LB" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ BQ check nahi ho saka — ghante ka shuru hai, loader chalega (lookback $LB)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── 🔑 SKIP: kal ka data pehle se hai to kuch mat karo ──
          YESTERDAY=$(date -u -d yesterday +%F)
          if [[ "$LAST" > "$YESTERDAY" ]] || [[ "$LAST" == "$YESTERDAY" ]]; then
            echo "✅ kal ka data ($LAST) pehle se hai — skip, kuch nahi karna"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🔍 kal ($YESTERDAY) ka data nahi — loader chalega"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "lookback=$LB" >> "$GITHUB_OUTPUT"

      # 🔁 RETRY — neeche wala main step 3 baar koshish karta hai.
      #    (nick-fields/retry se: platform API 5xx / timeout par khud dobara)
      - name: Run Facebook → BigQuery sync
        if: steps.before.outputs.skip != 'true'
        env:
          FB_APP_ID:            ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET:        ${{ secrets.FB_APP_SECRET }}
          FB_ACCESS_TOKEN:      ${{ secrets.FB_ACCESS_TOKEN }}
          FB_BUSINESS_ID:       ${{ secrets.FB_BUSINESS_ID }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PIXEL_ID:          ${{ secrets.FB_PIXEL_ID }}
          GCP_PROJECT:          ${{ secrets.GCP_PROJECT }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET:           facebook_data
          LOOKBACK_DAYS:        ${{ steps.before.outputs.lookback || github.event.inputs.lookback_days || '45' }}
          # 🆕 v3 knobs
          # 🆕 v4: MAX_POLL_SECONDS ab dispatch se aata hai (pehle "900" hardcoded tha)
          MAX_POLL_SECONDS:     ${{ github.event.inputs.max_poll_seconds || '900' }}
          POLL_INTERVAL:        "10"
          ACTIVE_ONLY:          ${{ github.event.inputs.active_only    || '0' }}
          ALLOW_TRUNCATE:       ${{ github.event.inputs.allow_truncate || '1' }}
          DRY_RUN:              ${{ github.event.inputs.dry_run        || '0' }}
          # 🆕 v4: ad_creatives ke waqt ke budget (v3.8/v3.9 se)
          #    creatives SAB SE AAKHIR mein chalte hain, is liye ye kisi
          #    revenue/spend table ko rok nahi sakte.
          CREATIVES_TOTAL_BUDGET:   ${{ github.event.inputs.creatives_total_budget   || '2400' }}
          CREATIVES_ACCOUNT_BUDGET: ${{ github.event.inputs.creatives_account_budget || '700' }}
          CREATIVES_PAGE_SIZE:      "25"
          CREATIVES_HTTP_TIMEOUT:   "45"
          CREATIVES_STRICT:         "0"
        run: python facebook_to_bigquery.py

      # 🆕 v3: ab ye ASAL mein fail karta hai (v2.1 mein sirf echo tha)
      #    v3.9 se script khud bhi ::error:: deti hai (Annotations box mein),
      #    ye us ke ilawa ek catch-all hai.
      - name: Fail loudly
        if: failure()
        run: |
          echo "::error::Facebook sync FAILED — upar ke logs mein 🔴 dhoondo."
          echo "Jin accounts ka fetch fail hua, unka purana data CHHUA NAHI gaya."
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # 🆕 v3 — KEEPALIVE
  # GitHub 60 din tak commit na hone pe scheduled workflows khud band kar deta
  # hai (owner ko email jata hai jo aksar kisi ne nahi dekha). Isi ne pehle
  # AdMob ~$27K aur FX ke 30 din khaye the — tareekhon se saabit:
  #     fx_rate  aakhri commit Apr 26 + 60 = Jun 25 → data ruka Jun 26
  #     admob ×3 aakhri commit May 20 + 60 = Jul 19 → data ruka Jul 19
  # ═══════════════════════════════════════════════════════════════════════════

      # ══════════════════════════════════════════════════════════════════════
      # 🛡️ SELF-HEAL ② — BAAD mein VERIFY. Kharab data mile to run LAAL.
      # ══════════════════════════════════════════════════════════════════════
      #  Teen check:
      #    1. rows KAM to nahi ho gaye  (koi loader TRUNCATE kar ke mar gaya?)
      #    2. aakhri din PEECHE to nahi gaya
      #    3. aaj ke window mein NEGATIVE ya NULL key to nahi
      #  Koi bhi fail → exit 1 → workflow red → tum ko pata chalega.
      #  🔑 Loader khud MERGE karta hai, is liye rollback ki zaroorat nahi —
      #     purana data waise hi mehfooz rehta hai.
      - name: "🛡️ Baad mein verify — bad data nahi jaana chahiye"
        if: always() && steps.before.outputs.skip != 'true'
        run: |
          set +e
          BEFORE_ROWS="${{ steps.before.outputs.rows || '0' }}"
          BEFORE_LAST="${{ steps.before.outputs.last || '' }}"
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date_start) AS STRING), COUNTIF(date_start IS NULL) FROM \`terafort.facebook_data.ad_insights_daily\`" 2>/dev/null | tail -1)
          if [ -z "$R" ]; then
            echo "::warning::verify skip — bq query nahi chali (setup-gcloud hai?)"
            exit 0
          fi
          AFTER_ROWS=$(echo "$R" | cut -d, -f1); AFTER_LAST=$(echo "$R" | cut -d, -f2); NULLS=$(echo "$R" | cut -d, -f3)
          echo "📊 baad:  ${AFTER_ROWS} rows · aakhri din ${AFTER_LAST} · null dates ${NULLS}"
          FAIL=0
          # 1. rows 5% se zyada KAM ho gaye = kuch toota
          if [ "$BEFORE_ROWS" -gt 100 ] && [ "$AFTER_ROWS" -lt $(( BEFORE_ROWS * 95 / 100 )) ]; then
            echo "::error::🔴 ROWS KAM HO GAYE: $BEFORE_ROWS → $AFTER_ROWS — loader ne data URA DIYA"; FAIL=1
          fi
          # 2. aakhri din peeche gaya
          if [[ "$BEFORE_LAST" =~ ^[0-9]{4} ]] && [[ "$AFTER_LAST" < "$BEFORE_LAST" ]]; then
            echo "::error::🔴 AAKHRI DIN PEECHE GAYA: $BEFORE_LAST → $AFTER_LAST"; FAIL=1
          fi
          # 3. null date key
          if [ "${NULLS:-0}" -gt 0 ]; then
            echo "::error::🔴 ${NULLS} rows par date NULL hai — kharab data"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::🔴 VERIFY FAIL — is run ka data bharosay ke qabil NAHI"
            exit 1
          fi
          echo "✅ verify pass — $(( AFTER_ROWS - BEFORE_ROWS )) rows badhe"

      # ══════════════════════════════════════════════════════════════════════
      # 📣 NAKAAMI PAR BATAO — chup-chaap fail na ho
      # ══════════════════════════════════════════════════════════════════════
      - name: "📣 Fail hua to summary mein likho"
        if: failure()
        run: |
          {
            echo "## 🔴 ${{ github.workflow }} — NAKAAM"
            echo "- run: ${{ github.run_id }}"
            echo "- waqt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- pehle: ${{ steps.before.outputs.rows }} rows · ${{ steps.before.outputs.last }}"
            echo "- 🔁 agli scheduled run khud dobara koshish karegi (din mein 4x)"
            echo "- 🩺 self-heal gap dekh kar lookback barha dega"
          } >> "$GITHUB_STEP_SUMMARY"
  keepalive:
    name: Keepalive (60-din auto-disable se bachao)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch repo (mahine mein ek baar)
        run: |
          # sirf mahine ki 1 tareekh ko
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Aaj 1 tareekh nahi — skip"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive [skip ci]" || exit 0
          git push
